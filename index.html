<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <!-- NASA-style fonts: Inter for body text, Public Sans for headings -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Public+Sans:wght@700;900&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <!-- Random "Did You Know?" space fact (filled in by script.js) -->
    <section class="fact" aria-live="polite">
      <strong>🚀 Did You Know?</strong> <span id="factText"></span>
    </section>

    <div class="filters">
      <label for="startDate" class="sr-only">Start date</label>
      <input type="date" id="startDate" />
      <label for="endDate" class="sr-only">End date</label>
      <input type="date" id="endDate" />
      <button id="getImagesBtn" type="button">Get Space Images</button>
    </div>

    <main id="gallery" class="gallery" aria-live="polite">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </main>
  </div>

  <!-- Modal: shows a bigger image, title, date and explanation -->
  <div id="modal" class="modal" hidden>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="closeModal" class="close-btn" type="button" aria-label="Close">&times;</button>
      <div id="modalMedia"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="modal-date"></p>
      <p id="modalExplanation"></p>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
